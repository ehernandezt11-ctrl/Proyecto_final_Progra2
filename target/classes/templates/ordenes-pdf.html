<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Reporte de Órdenes</title>
    <style>
        body { font-family: Arial, sans-serif; font-size: 12px; color: #333; margin: 20px; }
        h2 { text-align: center; color: #2c3e50; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { background-color: #007bff; color: #ffffff; padding: 8px; border: 1px solid #ddd; text-align: left; }
        td { padding: 8px; border: 1px solid #ddd; }
    </style>
</head>
<body>
    <h2>Reporte General de Órdenes de Trabajo</h2>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Vehículo ID</th>
                <th>Mecánico ID</th>
                <th>Fecha Ingreso</th>
                <th>Fecha Entrega</th>
                <th>Descripción</th>
                <th>Estado</th>
                <th>Costo Total</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="o : ${ordenes}">
                <td th:text="${o.idOrden}"></td>
                <td th:text="${o.idVehiculo}"></td>
                <td th:text="${o.idMecanico}"></td>
                <td th:text="${o.fechaIngreso}"></td>
                <td th:text="${o.fechaEntrega != null ? o.fechaEntrega : '-'}"></td>
                <td th:text="${o.descripcionProblema}"></td>
                <td th:text="${o.estado}"></td>
                <td th:text="'Q ' + ${#numbers.formatDecimal(o.costoTotal, 1, 2)}"></td>
            </tr>
        </tbody>
    </table>
</body>
</html>
